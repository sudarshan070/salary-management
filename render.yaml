# Render Blueprint for the API (free web service).
# The free plan has no persistent disk, so data lives in Turso (hosted SQLite).
services:
  - type: web
    name: salary-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npx pnpm@10.34.6 install --frozen-lockfile --prod=false && npx pnpm@10.34.6 --filter @salary/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # First boot on an empty Turso database seeds the 10,000 demo employees.
      - key: SEED_IF_EMPTY
        value: 'true'
